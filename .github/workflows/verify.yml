name: Verify

on:
  push:

permissions:
  contents: read

jobs:
  checks:
    name: ${{ matrix.shard }}
    strategy:
      fail-fast: false
      matrix:
        shard: [app, core, planning, rules, archive]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: 'true'
      SEED_VERIFY_SHARD: ${{ matrix.shard }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1; action runtime Node 24
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0; action runtime Node 24
        with:
          node-version: '22.20.0'
          package-manager-cache: false
      - name: Check edition source lock freshness
        # Technical foundation exports use composition.lock.json or reference-export.json.
        # Edition-owned seeds must commit both edition.json and sources.lock.json.
        if: ${{ hashFiles('edition.json', 'sources.lock.json') != '' }}
        run: node scripts/edition-authoring/cli.mjs check
      - run: npm install --global pnpm@10.12.4
      - run: pnpm install --frozen-lockfile
      - if: matrix.shard != 'archive'
        run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec rer check --profile first-party
      - if: matrix.shard == 'app'
        run: pnpm exec rer verify --no-queue
      - if: matrix.shard != 'app'
        run: pnpm run verify:app

  verify:
    if: always()
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Require every verification shard
        env:
          RESULT: ${{ needs.checks.result }}
        run: test "$RESULT" = success
